<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ОПЛОТ - Full RPG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; font-family: 'Courier New', monospace; }
    canvas { width: 100% !important; height: 100% !important; display: block; }
    
    #gameUI {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }
    
    .panel {
      position: fixed;
      background: rgba(0,0,0,0.9);
      color: #0f0;
      font-size: 12px;
      border: 2px solid #0f0;
      border-radius: 3px;
      padding: 10px;
      pointer-events: auto;
    }
    
    #playerPanel {
      top: 10px;
      left: 10px;
      width: 200px;
    }
    
    #enemyPanel {
      top: 10px;
      right: 10px;
      width: 200px;
      text-align: right;
    }
    
    #basePanel {
      bottom: 10px;
      left: 10px;
      width: 250px;
    }
    
    #perkPanel {
      bottom: 10px;
      right: 10px;
      width: 250px;
      text-align: right;
    }
    
    .stat { margin: 3px 0; }
    .bar { width: 100%; height: 15px; background: #111; border: 1px solid #0f0; margin: 2px 0; position: relative; }
    .barFill { height: 100%; background: #0f0; transition: width 0.2s; }
    .barFill.boss { background: #f0f; }
    .barText { position: absolute; width: 100%; text-align: center; line-height: 15px; font-size: 10px; color: #000; }
    
    #combatUI {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }
    
    button {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      border: 2px solid #0f0;
      border-radius: 3px;
      background: #000;
      color: #0f0;
      cursor: pointer;
      transition: all 0.1s;
    }
    
    button:hover { background: #0f0; color: #000; }
    button:active { transform: scale(0.95); }
    button:disabled { opacity: 0.3; cursor: not-allowed; }
    
    #status {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.95);
      border: 3px solid #0f0;
      color: #0f0;
      padding: 20px;
      text-align: center;
      font-size: 16px;
      display: none;
      z-index: 200;
      min-width: 300px;
    }
    
    .victory { border-color: #0f0; color: #0f0; }
    .defeat { border-color: #f00; color: #f00; }
    .boss { border-color: #f0f; color: #f0f; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <div id="gameUI">
    <div id="playerPanel" class="panel">
      <div style="text-align: center; border-bottom: 1px solid #0f0; margin-bottom: 5px; font-weight: bold;">PLAYER</div>
      <div class="stat">LVL: <span id="playerLevel">1</span></div>
      <div class="stat">HP: <span id="playerHp">100</span>/<span id="playerMaxHp">100</span></div>
      <div class="bar"><div class="barFill" id="playerHpBar" style="width: 100%;"></div></div>
      <div class="stat">XP: <span id="playerXp">0</span>/<span id="playerMaxXp">100</span></div>
      <div class="bar"><div class="barFill" id="playerXpBar" style="width: 0%; background: #00f;"></div></div>
      <div class="stat" style="margin-top: 5px; color: #f90;" id="weaponInfo">Fists 1-5</div>
      <div class="stat" style="font-size: 10px; color: #666; margin-top: 5px;" id="perkList"></div>
    </div>
    
    <div id="enemyPanel" class="panel">
      <div style="text-align: center; border-bottom: 1px solid #0f0; margin-bottom: 5px; font-weight: bold;">ENEMY</div>
      <div class="stat"><span id="enemyName">Looter</span> L<span id="enemyLevel">1</span></div>
      <div class="bar"><div class="barFill" id="enemyHpBar" style="width: 100%;"></div><div class="barText" id="enemyHpText">100/100</div></div>
      <div class="stat" style="color: #ff0; margin-top: 5px;" id="enemyPhase"></div>
    </div>
    
    <div id="basePanel" class="panel">
      <div style="border-bottom: 1px solid #0f0; margin-bottom: 5px; font-weight: bold;">BASE</div>
      <div class="stat">🌾 Food: <span id="foodAmount">100</span></div>
      <div class="stat">⚡ Energy: <span id="energyAmount">100</span></div>
      <div class="stat">🔧 Components: <span id="componentsAmount">10</span></div>
      <div class="stat" style="font-size: 10px; color: #666; margin-top: 5px;">Farm Lv<span id="farmLevel">1</span> | Gen Lv<span id="genLevel">1</span></div>
    </div>
    
    <div id="perkPanel" class="panel">
      <div style="border-bottom: 1px solid #0f0; margin-bottom: 5px; font-weight: bold;">PERKS</div>
      <div id="activePerksList" style="font-size: 11px; line-height: 1.4;"></div>
      <div id="levelupMenu" style="display: none; margin-top: 10px;">
        <div style="color: #ff0; margin-bottom: 5px;">⭐ CHOOSE PERK:</div>
        <div id="perkChoices"></div>
      </div>
    </div>
    
    <div id="combatUI">
      <button onclick="game.attack('light')">⚡ LIGHT</button>
      <button onclick="game.attack('heavy')">💥 HEAVY</button>
      <button onclick="game.retreat()">🏃 RETREAT</button>
    </div>
    
    <div id="status" class="victory"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/babylonjs@6/babylon.js"></script>
  <script>
    console.log('[INIT] OPLOT - Full RPG Starting...');
    
    // GAME SYSTEM
    const game = {
      // Player stats
      player: {
        level: 1,
        hp: 100,
        maxHp: 100,
        xp: 0,
        maxXp: 100,
        weapon: { name: 'Fists', damage: [1, 5] },
        perks: [],
        baseStats: {
          attack: 1,
          defense: 0,
          critChance: 0.15
        }
      },
      
      // Base resources
      base: {
        food: 100,
        energy: 100,
        components: 10,
        farm: { level: 1, production: 1 },
        generator: { level: 1, production: 0.8 },
        workbench: { level: 1, craftTime: 5 },
        storage: { level: 1, capacity: 1000 }
      },
      
      // Perks database
      perksDb: [
        { id: 'iron_skin', name: 'Iron Skin', desc: '+20 MaxHP', effect: () => { game.player.maxHp += 20; game.player.hp += 20; } },
        { id: 'quick_reflexes', name: 'Quick Reflexes', desc: '+25% Dodge', effect: () => { game.player.baseStats.dodge = 0.25; } },
        { id: 'heavy_handed', name: 'Heavy Handed', desc: '+50% DMG', effect: () => {} },
        { id: 'lucky_shot', name: 'Lucky Shot', desc: '+15% Crit', effect: () => { game.player.baseStats.critChance += 0.15; } },
        { id: 'vampirism', name: 'Vampirism', desc: 'Heal 30% dmg', effect: () => { game.player.baseStats.vampirism = 0.3; } }
      ],
      
      // Weapons loot table
      weapons: [
        { name: 'Makarov', damage: [5, 10], rarity: 'common' },
        { name: 'Lee-Enfield', damage: [10, 20], rarity: 'common' },
        { name: 'Shotgun', damage: [15, 25], rarity: 'common' },
        { name: 'Plasma Rifle', damage: [20, 35], rarity: 'rare' },
        { name: 'Railgun', damage: [30, 50], rarity: 'rare' },
        { name: 'Commandant Sword', damage: [40, 60], rarity: 'epic' },
        { name: 'Genesis Cannon', damage: [60, 100], rarity: 'epic' }
      ],
      
      // Enemy types
      enemyTypes: [
        { name: 'Looter', baseHp: 25, baseDmg: [2, 6], xp: 40, level: 1, isBoss: false },
        { name: 'Soldier', baseHp: 50, baseDmg: [5, 12], xp: 80, level: 2, isBoss: false },
        { name: 'Mutant', baseHp: 75, baseDmg: [8, 18], xp: 120, level: 3, isBoss: false },
        { name: 'Elite', baseHp: 100, baseDmg: [12, 22], xp: 160, level: 4, isBoss: false },
        { name: 'Commandant Alpha', baseHp: 200, baseDmg: [20, 40], xp: 500, level: 5, isBoss: true }
      ],
      
      // Boss abilities
      bossAbilities: [
        { name: 'Power Strike', damage: 2.0, cooldown: 2, lastUsed: -999 },
        { name: 'Shockwave', damage: 1.5, cooldown: 3, lastUsed: -999 },
        { name: 'Execute', damage: 3.0, cooldown: 4, lastUsed: -999 }
      ],
      
      // Current battle state
      enemy: null,
      inBattle: false,
      babylon3D: null,
      ui3D: null,
      
      // Initialize game
      init(scene, enemy3D, enemyMaterial) {
        this.babylon3D = { scene, enemy3D, enemyMaterial };
        this.spawnEnemy();
        this.updateUI();
      },
      
      // Spawn enemy
      spawnEnemy() {
        const isBoss = this.player.level > 0 && this.player.level % 5 === 0;
        const enemyPool = this.enemyTypes.filter(e => e.isBoss === isBoss);
        const template = enemyPool[Math.floor(Math.random() * enemyPool.length)];
        
        const levelMult = 1 + (this.player.level - 1) * 0.15;
        this.enemy = {
          ...template,
          hp: Math.ceil(template.baseHp * levelMult),
          currentHp: Math.ceil(template.baseHp * levelMult),
          damage: [
            Math.ceil(template.baseDmg[0] * levelMult),
            Math.ceil(template.baseDmg[1] * levelMult)
          ],
          level: this.player.level,
          phase: 1,
          abilityUses: 0
        };
        
        this.inBattle = true;
        const colors = {
          'Looter': [0.8, 0.2, 0.2],
          'Soldier': [0.5, 0.5, 0.8],
          'Mutant': [0.2, 0.8, 0.2],
          'Elite': [1, 0.8, 0.2],
          'Commandant Alpha': [1, 0, 1]
        };
        const c = colors[template.name] || [1, 0.2, 0.2];
        this.babylon3D.enemyMaterial.emissiveColor = new BABYLON.Color3(c[0], c[1], c[2]);
        this.updateUI();
      },
      
      // Attack function
      attack(type) {
        if (!this.inBattle || !this.enemy) return;
        
        let damage = 0;
        if (type === 'light') {
          damage = Math.floor(Math.random() * (this.player.weapon.damage[1] - this.player.weapon.damage[0] + 1)) + this.player.weapon.damage[0];
        } else if (type === 'heavy') {
          damage = Math.floor(Math.random() * (this.player.weapon.damage[1] - this.player.weapon.damage[0] + 1)) + this.player.weapon.damage[0];
          damage = Math.ceil(damage * 1.5);
        }
        
        // Crit chance
        if (Math.random() < this.player.baseStats.critChance) {
          damage *= 2;
        }
        
        // Boss phase-based scaling
        if (this.enemy.isBoss) {
          const hpPercent = this.enemy.currentHp / this.enemy.hp;
          if (hpPercent < 0.33) this.enemy.phase = 3;
          else if (hpPercent < 0.66) this.enemy.phase = 2;
          else this.enemy.phase = 1;
          
          damage = Math.ceil(damage * (1 + (this.enemy.phase - 1) * 0.2));
        }
        
        this.enemy.currentHp -= damage;
        
        // Hit visual
        const orig = this.babylon3D.enemyMaterial.emissiveColor.clone();
        this.babylon3D.enemyMaterial.emissiveColor = new BABYLON.Color3(1, 1, 1);
        setTimeout(() => {
          this.babylon3D.enemyMaterial.emissiveColor = orig;
        }, 100);
        
        // Enemy dies
        if (this.enemy.currentHp <= 0) {
          this.onVictory();
          return;
        }
        
        // Enemy counter attack
        const counterDmg = Math.floor(Math.random() * (this.enemy.damage[1] - this.enemy.damage[0] + 1)) + this.enemy.damage[0];
        this.player.hp -= counterDmg;
        
        if (this.player.hp <= 0) {
          this.onDefeat();
          return;
        }
        
        this.updateUI();
      },
      
      // Retreat
      retreat() {
        if (!this.inBattle) return;
        this.inBattle = false;
        this.enemy = null;
        this.showStatus('Retreated!', 'victory');
        this.updateUI();
      },
      
      // Victory
      onVictory() {
        this.inBattle = false;
        
        // Loot
        const loot = Math.random() < 0.4 ? this.weapons[Math.floor(Math.random() * this.weapons.length)] : null;
        if (loot) {
          this.player.weapon = loot;
        }
        
        const xpGain = Math.ceil(this.enemy.xp * (1 + (this.player.level - this.enemy.level) * 0.05));
        this.player.xp += xpGain;
        
        const statusMsg = this.enemy.isBoss 
          ? `🏆 BOSS DEFEATED!\n+${xpGain} XP${loot ? '\n' + loot.name + ' (' + loot.rarity + ')' : ''}`
          : `Victory! +${xpGain} XP${loot ? '\n' + loot.name : ''}`;
        
        this.showStatus(statusMsg, this.enemy.isBoss ? 'boss' : 'victory');
        
        if (this.player.xp >= this.player.maxXp) {
          this.levelUp();
        }
        
        this.enemy = null;
        this.updateUI();
      },
      
      // Defeat
      onDefeat() {
        this.inBattle = false;
        this.player.hp = 0;
        this.showStatus('💀 DEFEATED!\nReviving...', 'defeat');
        setTimeout(() => {
          this.player.hp = this.player.maxHp;
          this.enemy = null;
          this.spawnEnemy();
          this.updateUI();
        }, 3000);
      },
      
      // Level up
      levelUp() {
        this.player.level++;
        this.player.xp = 0;
        this.player.maxXp = Math.ceil(this.player.maxXp * 1.1);
        this.player.maxHp += 10;
        this.player.hp = this.player.maxHp;
        
        // Show perk choices
        this.showLevelupMenu();
      },
      
      // Choose perk
      choosePerk(perkId) {
        const perk = this.perksDb.find(p => p.id === perkId);
        if (perk && !this.player.perks.includes(perkId)) {
          this.player.perks.push(perkId);
          perk.effect();
        }
        document.getElementById('levelupMenu').style.display = 'none';
        this.updateUI();
      },
      
      // Show levelup menu
      showLevelupMenu() {
        const available = this.perksDb.filter(p => !this.player.perks.includes(p.id)).slice(0, 3);
        let html = '';
        for (const perk of available) {
          html += `<button onclick="game.choosePerk('${perk.id}')" style="display: block; width: 100%; margin: 3px 0; text-align: left; font-size: 10px;">${perk.name}: ${perk.desc}</button>`;
        }
        document.getElementById('perkChoices').innerHTML = html;
        document.getElementById('levelupMenu').style.display = 'block';
      },
      
      // Update UI
      updateUI() {
        document.getElementById('playerLevel').textContent = this.player.level;
        document.getElementById('playerHp').textContent = this.player.hp;
        document.getElementById('playerMaxHp').textContent = this.player.maxHp;
        document.getElementById('playerHpBar').style.width = (this.player.hp / this.player.maxHp * 100) + '%';
        document.getElementById('playerXp').textContent = this.player.xp;
        document.getElementById('playerMaxXp').textContent = this.player.maxXp;
        document.getElementById('playerXpBar').style.width = (this.player.xp / this.player.maxXp * 100) + '%';
        
        document.getElementById('weaponInfo').textContent = `${this.player.weapon.name} ${this.player.weapon.damage[0]}-${this.player.weapon.damage[1]}`;
        
        const perkNames = this.player.perks.map(p => this.perksDb.find(x => x.id === p)?.name).join(', ');
        document.getElementById('perkList').textContent = perkNames ? 'Perks: ' + perkNames : 'No perks';
        document.getElementById('activePerksList').textContent = perkNames ? perkNames : 'None yet';
        
        if (this.enemy) {
          document.getElementById('enemyName').textContent = this.enemy.name;
          document.getElementById('enemyLevel').textContent = this.enemy.level;
          document.getElementById('enemyHpText').textContent = `${this.enemy.currentHp}/${this.enemy.hp}`;
          const hpPct = (this.enemy.currentHp / this.enemy.hp) * 100;
          document.getElementById('enemyHpBar').style.width = hpPct + '%';
          document.getElementById('enemyHpBar').className = 'barFill' + (this.enemy.isBoss ? ' boss' : '');
          
          if (this.enemy.isBoss) {
            document.getElementById('enemyPhase').textContent = `Phase ${this.enemy.phase}/3`;
          } else {
            document.getElementById('enemyPhase').textContent = '';
          }
        }
        
        document.getElementById('foodAmount').textContent = Math.floor(this.base.food);
        document.getElementById('energyAmount').textContent = Math.floor(this.base.energy);
        document.getElementById('componentsAmount').textContent = Math.floor(this.base.components);
        document.getElementById('farmLevel').textContent = this.base.farm.level;
        document.getElementById('genLevel').textContent = this.base.generator.level;
      },
      
      // Show status message
      showStatus(msg, type) {
        const el = document.getElementById('status');
        el.textContent = msg;
        el.className = type;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 2500);
      }
    };
    
    // BABYLON.JS INITIALIZATION
    try {
      const canvas = document.getElementById('canvas');
      const engine = new BABYLON.Engine(canvas, true);
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.05, 0.05, 0.05, 1);
      
      const camera = new BABYLON.ArcRotateCamera('cam', Math.PI, Math.PI / 2.5, 25, BABYLON.Vector3.Zero(), scene);
      camera.attachControl(canvas, true);
      
      const light = new BABYLON.HemisphericLight('light', new BABYLON.Vector3(0.5, 1, 0.5), scene);
      light.intensity = 1.2;
      
      const enemy3D = BABYLON.MeshBuilder.CreateBox('enemy', { size: 1.5 }, scene);
      enemy3D.position.z = 5;
      
      const mat = new BABYLON.StandardMaterial('mat', scene);
      enemy3D.material = mat;
      
      engine.runRenderLoop(() => {
        enemy3D.rotation.y += 0.005;
        const scale = 1 + (game.player.level - 1) * 0.15;
        if (game.enemy) {
          const healthScale = Math.max(0.3, game.enemy.currentHp / game.enemy.hp);
          enemy3D.scaling = new BABYLON.Vector3(scale * healthScale, scale * healthScale, scale * healthScale);
        }
        scene.render();
      });
      
      window.addEventListener('resize', () => engine.resize());
      setTimeout(() => engine.resize(), 100);
      
      game.init(scene, enemy3D, mat);
      console.log('[SUCCESS] OPLOT Full RPG loaded!');
      
    } catch(e) {
      console.error('[ERROR]', e);
      alert('Error: ' + e.message);
    }
  </script>
</body>
</html>
