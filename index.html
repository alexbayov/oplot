<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { margin: 0; }
    canvas { display: block; width: 100% !important; height: 100% !important; }
    #ui {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 100;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .light { background: #00ff00; color: #000; }
    .heavy { background: #ff6600; color: #fff; }
    .retreat { background: #0099ff; color: #fff; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <button class="light" onclick="attack('light')">⚡ LIGHT</button>
    <button class="heavy" onclick="attack('heavy')">💥 HEAVY</button>
    <button class="retreat" onclick="attack('retreat')">🏃 RETREAT</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/babylonjs@6.48.0/babylon.js"></script>
  <script>
    window.addEventListener('load', function() {
      const canvas = document.getElementById('canvas');
      const engine = new BABYLON.Engine(canvas, true);
      const scene = new BABYLON.Scene(engine);
      
      scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.1, 1);
      
      // Камера
      const camera = new BABYLON.ArcRotateCamera('cam', 0, Math.PI/2.5, 20, BABYLON.Vector3.Zero(), scene);
      camera.attachControl(canvas, true);
      
      // Свет
      const light = new BABYLON.HemisphericLight('light', new BABYLON.Vector3(1, 1, 0), scene);
      light.intensity = 0.8;
      
      // Враг
      const enemy = BABYLON.MeshBuilder.CreateBox('enemy', { size: 1 }, scene);
      enemy.position.z = 5;
      const mat = new BABYLON.StandardMaterial('mat', scene);
      mat.emissiveColor = new BABYLON.Color3(1, 0, 0);
      enemy.material = mat;
      
      // Функция атаки
      window.attack = function(type) {
        console.log('Attack: ' + type);
        if (type === 'light') enemy.position.x += 0.5;
        if (type === 'heavy') { enemy.position.x -= 0.5; enemy.rotation.z += 0.3; }
        if (type === 'retreat') camera.radius -= 2;
      };
      
      // Render loop
      engine.runRenderLoop(() => {
        enemy.rotation.y += 0.005;
        scene.render();
      });
      
      // Resize
      window.addEventListener('resize', () => {
        engine.resize();
      });
      
      // Force resize on load
      setTimeout(() => engine.resize(), 100);
      
      console.log('✅ ОПЛОТ Game loaded! v1.0');
    });
</body>
</html>
